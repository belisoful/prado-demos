<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 168" width="210" height="168" font-family="Verdana, 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0.5" dy="0.8" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <g id="folder">
      <rect x="0.5" y="-4.4" width="6.5" height="2.9" rx="0.8" fill="#e9b949" stroke="#a9791a" stroke-width="0.6"/>
      <rect x="0" y="-2.7" width="15.5" height="9.4" rx="1.3" fill="#f6cf6b" stroke="#a9791a" stroke-width="0.8"/>
    </g>
    <g id="page">
      <path d="M1,-5 h7.4 l3.2,3.2 v8.9 h-10.6 z" fill="#ffffff" stroke="#8a8a8a" stroke-width="0.8" stroke-linejoin="round"/>
      <path d="M8.4,-5 v3.2 h3.2" fill="none" stroke="#8a8a8a" stroke-width="0.8"/>
      <line x1="3" y1="-0.6" x2="9" y2="-0.6" stroke="#c4c4c4" stroke-width="0.7"/>
      <line x1="3" y1="1.7" x2="9" y2="1.7" stroke="#c4c4c4" stroke-width="0.7"/>
      <line x1="3" y1="4.0" x2="7.4" y2="4.0" stroke="#c4c4c4" stroke-width="0.7"/>
    </g>
    <g id="pagedoc">
      <path d="M1,-5 h7.4 l3.2,3.2 v8.9 h-10.6 z" fill="#eaf2fb" stroke="#6f93bd" stroke-width="0.8" stroke-linejoin="round"/>
      <path d="M8.4,-5 v3.2 h3.2" fill="none" stroke="#6f93bd" stroke-width="0.8"/>
      <line x1="3" y1="-0.6" x2="9" y2="-0.6" stroke="#9db8d6" stroke-width="0.7"/>
      <line x1="3" y1="1.7" x2="9" y2="1.7" stroke="#9db8d6" stroke-width="0.7"/>
      <line x1="3" y1="4.0" x2="7.4" y2="4.0" stroke="#9db8d6" stroke-width="0.7"/>
    </g>
  </defs>

  <rect x="0" y="0" width="210" height="168" fill="#ffffff"/>

  <!-- tree connectors (dotted) -->
  <g stroke="#9aa0a6" stroke-width="0.8" stroke-dasharray="1.2 1.3" fill="none">
    <!-- wwwroot spine (x=16): to assets(40), protected(62), index.php(150) -->
    <path d="M16,26 V150"/>
    <path d="M16,40 H26"/>
    <path d="M16,62 H26"/>
    <path d="M16,150 H26"/>
    <!-- protected spine (x=34): to pages(84), runtime(128) -->
    <path d="M34,70 V128"/>
    <path d="M34,84 H44"/>
    <path d="M34,128 H44"/>
    <!-- pages spine (x=52): to Home.page(106) -->
    <path d="M52,92 V106"/>
    <path d="M52,106 H62"/>
  </g>

  <!-- rows: icon + label -->
  <use href="#folder" x="8"  y="18"  filter="url(#ds)"/>
  <text x="27" y="21.5" font-size="10.5" font-weight="600" fill="#222">wwwroot</text>

  <use href="#folder" x="26" y="40"  filter="url(#ds)"/>
  <text x="45" y="43.5" font-size="10.5" fill="#222">assets</text>

  <use href="#folder" x="26" y="62"  filter="url(#ds)"/>
  <text x="45" y="65.5" font-size="10.5" fill="#222">protected</text>

  <use href="#folder" x="44" y="84"  filter="url(#ds)"/>
  <text x="63" y="87.5" font-size="10.5" fill="#222">pages</text>

  <use href="#pagedoc" x="62" y="106" filter="url(#ds)"/>
  <text x="81" y="109.5" font-size="10.5" fill="#222">Home.page</text>

  <use href="#folder" x="44" y="128" filter="url(#ds)"/>
  <text x="63" y="131.5" font-size="10.5" fill="#222">runtime</text>

  <use href="#page" x="26" y="150" filter="url(#ds)"/>
  <text x="45" y="153.5" font-size="10.5" fill="#222">index.php</text>
</svg>
