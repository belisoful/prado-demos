  </g>
  <path d="M58,827.0 V834.0" stroke="#b23b3b" stroke-width="1.2" marker-end="url(#arrowr)" fill="none"/>
  <text transform="translate(49.0,533.0) rotate(-90)" font-size="9" fill="#b23b3b" text-anchor="middle">on exception (any step)</text>
  <polygon points="58,834.0 106,854.0 58,874.0 10,854.0" fill="#fff3e0" stroke="#b23b3b" stroke-width="1.2" filter="url(#ds)"/>
