    <path d="M135,288.0 H58"/>
    <path d="M135,828.0 H58"/>
    <path d="M58,288.0 V858.0"/>
  </g>
  <path d="M58,852.0 V859.0" stroke="#b23b3b" stroke-width="1.2" marker-end="url(#arrowr)" fill="none"/>
  <text transform="translate(49.0,558.0) rotate(-90)" font-size="9" fill="#b23b3b" text-anchor="middle">on exception (any step)</text>
  <polygon points="58,859.0 106,879.0 58,899.0 10,879.0" fill="#fff3e0" stroke="#b23b3b" stroke-width="1.2" filter="url(#ds)"/>
  <text x="58" y="879.0" font-size="8.4" fill="#7a1f1f" text-anchor="middle" dominant-baseline="central">TExitException?</text>
  <path d="M58,899.0 V921.0" stroke="#b23b3b" stroke-width="1.2" marker-end="url(#arrowr)" fill="none"/>
  <text x="63.0" y="910.0" font-size="8.6" fill="#b23b3b">No</text>
  <rect x="14.0" y="921.0" width="88" height="24" rx="12.0" ry="12.0" fill="#f7d1d1" stroke="#b23b3b" stroke-width="1.3" filter="url(#ds)"/>
  <text x="58" y="933.0" font-size="9.5" fill="#7a1f1f" font-weight="600" text-anchor="middle" dominant-baseline="central">onError</text>
  <path d="M102.0,933.0 H135.0" fill="none" stroke="#b23b3b" stroke-width="1.3" marker-end="url(#arrowr)"/>
  <path d="M106.0,879.0 L135.0,927.0" fill="none" stroke="#b23b3b" stroke-width="1.3" marker-end="url(#arrowr)"/>
  <text x="120.0" y="879.0" font-size="8.6" fill="#b23b3b" text-anchor="middle" dominant-baseline="central">Yes</text>
  <rect x="135.0" y="90.0" width="150" height="26" rx="13.0" ry="13.0" fill="#d4e3f4" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="210" y="103.0" font-size="9.5" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">Application construction</text>
  <line x1="285.0" y1="103.0" x2="300" y2="103.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2.5 2"/>
  <path d="M300,84.9 H610 L620,94.9 V121.1 H300 Z" fill="#fffdf3" stroke="#9a9a8f" stroke-width="0.9" filter="url(#ds)"/>
  <path d="M610,84.9 V94.9 H620" fill="none" stroke="#9a9a8f" stroke-width="0.9"/>
  <text x="308" y="96.7" font-size="10" fill="#333" dominant-baseline="central">Register the application singleton. Set the base, runtime,</text>
  <text x="308" y="109.3" font-size="10" fill="#333" dominant-baseline="central">and configuration paths.</text>
  <rect x="135.0" y="137.0" width="150" height="93.0" rx="10" ry="10" fill="#d4e3f4" stroke="#2f2f2f" stroke-width="1.2" filter="url(#ds)"/>
  <text x="210" y="148.0" font-size="10" font-weight="600" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">initApplication</text>
  <line x1="141.0" y1="157.0" x2="279.0" y2="157.0" stroke="#a9b7c9" stroke-width="0.8"/>
  <rect x="150.0" y="161.0" width="120" height="22" rx="11.0" ry="11.0" fill="#fff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="210" y="172.0" font-size="9" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">onConfiguration</text>
  <rect x="150.0" y="199.0" width="120" height="22" rx="11.0" ry="11.0" fill="#fff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="210" y="210.0" font-size="9" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">onInitComplete</text>
  <line x1="210" y1="158.0" x2="210" y2="161.0" stroke="#5a6472" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="210" y1="183.0" x2="210" y2="199.0" stroke="#5a6472" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="285.0" y1="172.0" x2="300" y2="166.6" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2.5 2"/>
  <path d="M300,142.2 H610 L620,152.2 V191.0 H300 Z" fill="#fffdf3" stroke="#9a9a8f" stroke-width="0.9" filter="url(#ds)"/>
  <path d="M610,142.2 V152.2 H620" fill="none" stroke="#9a9a8f" stroke-width="0.9"/>
  <text x="308" y="154.0" font-size="10" fill="#333" dominant-baseline="central">The configuration is fully applied and the modules are</text>
  <text x="308" y="166.6" font-size="10" fill="#333" dominant-baseline="central">loaded. No service has started. Register additional</text>
  <text x="308" y="179.2" font-size="10" fill="#333" dominant-baseline="central">services here.</text>
  <line x1="285.0" y1="210.0" x2="300" y2="224.2" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2.5 2"/>
  <path d="M300,206.1 H610 L620,216.1 V242.3 H300 Z" fill="#fffdf3" stroke="#9a9a8f" stroke-width="0.9" filter="url(#ds)"/>
  <path d="M610,206.1 V216.1 H620" fill="none" stroke="#9a9a8f" stroke-width="0.9"/>
  <text x="308" y="217.9" font-size="10" fill="#333" dominant-baseline="central">The requested service is loaded and initialized. The</text>
  <text x="308" y="230.5" font-size="10" fill="#333" dominant-baseline="central">request is about to begin.</text>
  <rect x="135.0" y="276.0" width="150" height="24" rx="12.0" ry="12.0" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="210" y="288.0" font-size="9.5" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">onBeginRequest</text>
  <line x1="285.0" y1="288.0" x2="300" y2="288.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2.5 2"/>
  <path d="M300,276.2 H610 L620,286.2 V299.8 H300 Z" fill="#fffdf3" stroke="#9a9a8f" stroke-width="0.9" filter="url(#ds)"/>
  <path d="M610,276.2 V286.2 H620" fill="none" stroke="#9a9a8f" stroke-width="0.9"/>
  <text x="308" y="288.0" font-size="10" fill="#333" dominant-baseline="central">The application starts to process the user request.</text>
  <rect x="135.0" y="321.0" width="150" height="24" rx="12.0" ry="12.0" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="210" y="333.0" font-size="9.5" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">onLoadState</text>
  <line x1="285.0" y1="333.0" x2="300" y2="333.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2.5 2"/>
  <path d="M300,314.9 H610 L620,324.9 V351.1 H300 Z" fill="#fffdf3" stroke="#9a9a8f" stroke-width="0.9" filter="url(#ds)"/>
  <path d="M610,314.9 V324.9 H620" fill="none" stroke="#9a9a8f" stroke-width="0.9"/>
  <text x="308" y="326.7" font-size="10" fill="#333" dominant-baseline="central">Load the application state from persistent storage under</text>
  <text x="308" y="339.3" font-size="10" fill="#333" dominant-baseline="central">the runtime directory.</text>
  <rect x="135.0" y="366.0" width="150" height="24" rx="12.0" ry="12.0" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="210" y="378.0" font-size="9.5" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">onLoadStateComplete</text>
  <line x1="285.0" y1="378.0" x2="300" y2="378.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2.5 2"/>
  <path d="M300,366.2 H610 L620,376.2 V389.8 H300 Z" fill="#fffdf3" stroke="#9a9a8f" stroke-width="0.9" filter="url(#ds)"/>
  <path d="M610,366.2 V376.2 H620" fill="none" stroke="#9a9a8f" stroke-width="0.9"/>
  <text x="308" y="378.0" font-size="10" fill="#333" dominant-baseline="central">The application state is restored.</text>
  <rect x="135.0" y="411.0" width="150" height="24" rx="12.0" ry="12.0" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="210" y="423.0" font-size="9.5" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">onAuthentication</text>
  <line x1="285.0" y1="423.0" x2="300" y2="423.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2.5 2"/>
  <path d="M300,404.9 H610 L620,414.9 V441.1 H300 Z" fill="#fffdf3" stroke="#9a9a8f" stroke-width="0.9" filter="url(#ds)"/>
  <path d="M610,404.9 V414.9 H620" fill="none" stroke="#9a9a8f" stroke-width="0.9"/>
  <text x="308" y="416.7" font-size="10" fill="#333" dominant-baseline="central">Determine the request user&#x27;s identity. The user becomes a</text>
  <text x="308" y="429.3" font-size="10" fill="#333" dominant-baseline="central">guest or a registered user.</text>
  <rect x="135.0" y="456.0" width="150" height="24" rx="12.0" ry="12.0" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="210" y="468.0" font-size="9.5" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">onAuthenticationComplete</text>
  <line x1="285.0" y1="468.0" x2="300" y2="468.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2.5 2"/>
  <path d="M300,456.2 H610 L620,466.2 V479.8 H300 Z" fill="#fffdf3" stroke="#9a9a8f" stroke-width="0.9" filter="url(#ds)"/>
  <path d="M610,456.2 V466.2 H620" fill="none" stroke="#9a9a8f" stroke-width="0.9"/>
  <text x="308" y="468.0" font-size="10" fill="#333" dominant-baseline="central">User authentication is complete.</text>
  <rect x="135.0" y="501.0" width="150" height="24" rx="12.0" ry="12.0" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="210" y="513.0" font-size="9.5" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">onAuthorization</text>
  <line x1="285.0" y1="513.0" x2="300" y2="513.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2.5 2"/>
  <path d="M300,494.9 H610 L620,504.9 V531.1 H300 Z" fill="#fffdf3" stroke="#9a9a8f" stroke-width="0.9" filter="url(#ds)"/>
  <path d="M610,494.9 V504.9 H620" fill="none" stroke="#9a9a8f" stroke-width="0.9"/>
  <text x="308" y="506.7" font-size="10" fill="#333" dominant-baseline="central">Determine whether the user may access the requested</text>
  <text x="308" y="519.3" font-size="10" fill="#333" dominant-baseline="central">resource.</text>
  <rect x="135.0" y="546.0" width="150" height="24" rx="12.0" ry="12.0" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="210" y="558.0" font-size="9.5" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">onAuthorizationComplete</text>
  <line x1="285.0" y1="558.0" x2="300" y2="558.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2.5 2"/>
  <path d="M300,546.2 H610 L620,556.2 V569.8 H300 Z" fill="#fffdf3" stroke="#9a9a8f" stroke-width="0.9" filter="url(#ds)"/>
  <path d="M610,546.2 V556.2 H620" fill="none" stroke="#9a9a8f" stroke-width="0.9"/>
  <text x="308" y="558.0" font-size="10" fill="#333" dominant-baseline="central">Authorization is complete.</text>
  <rect x="135.0" y="591.0" width="150" height="24" rx="12.0" ry="12.0" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="210" y="603.0" font-size="9.5" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">onPreRunService</text>
  <line x1="285.0" y1="603.0" x2="300" y2="603.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2.5 2"/>
  <path d="M300,591.2 H610 L620,601.2 V614.8 H300 Z" fill="#fffdf3" stroke="#9a9a8f" stroke-width="0.9" filter="url(#ds)"/>
  <path d="M610,591.2 V601.2 H620" fill="none" stroke="#9a9a8f" stroke-width="0.9"/>
  <text x="308" y="603.0" font-size="10" fill="#333" dominant-baseline="central">Prepare to run the requested service.</text>
  <rect x="135.0" y="636.0" width="150" height="24" rx="12.0" ry="12.0" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="210" y="648.0" font-size="9.5" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">runService</text>
  <line x1="285.0" y1="648.0" x2="300" y2="648.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2.5 2"/>
  <path d="M300,636.2 H610 L620,646.2 V659.8 H300 Z" fill="#fffdf3" stroke="#9a9a8f" stroke-width="0.9" filter="url(#ds)"/>
  <path d="M610,636.2 V646.2 H620" fill="none" stroke="#9a9a8f" stroke-width="0.9"/>
  <text x="308" y="648.0" font-size="10" fill="#333" dominant-baseline="central">The requested service runs and produces the response.</text>
  <rect x="135.0" y="681.0" width="150" height="24" rx="12.0" ry="12.0" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="210" y="693.0" font-size="9.5" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">onSaveState</text>
  <line x1="285.0" y1="693.0" x2="300" y2="693.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2.5 2"/>
  <path d="M300,674.9 H610 L620,684.9 V711.1 H300 Z" fill="#fffdf3" stroke="#9a9a8f" stroke-width="0.9" filter="url(#ds)"/>
  <path d="M610,674.9 V684.9 H620" fill="none" stroke="#9a9a8f" stroke-width="0.9"/>
  <text x="308" y="686.7" font-size="10" fill="#333" dominant-baseline="central">Save the application state to persistent storage under the</text>
  <text x="308" y="699.3" font-size="10" fill="#333" dominant-baseline="central">runtime directory.</text>
  <rect x="135.0" y="726.0" width="150" height="24" rx="12.0" ry="12.0" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="210" y="738.0" font-size="9.5" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">onSaveStateComplete</text>
  <line x1="285.0" y1="738.0" x2="300" y2="738.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2.5 2"/>
  <path d="M300,726.2 H610 L620,736.2 V749.8 H300 Z" fill="#fffdf3" stroke="#9a9a8f" stroke-width="0.9" filter="url(#ds)"/>
  <path d="M610,726.2 V736.2 H620" fill="none" stroke="#9a9a8f" stroke-width="0.9"/>
  <text x="308" y="738.0" font-size="10" fill="#333" dominant-baseline="central">The application state is stored.</text>
  <rect x="135.0" y="771.0" width="150" height="24" rx="12.0" ry="12.0" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="210" y="783.0" font-size="9.5" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">onPreFlushOutput</text>
  <line x1="285.0" y1="783.0" x2="300" y2="783.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2.5 2"/>
  <path d="M300,771.2 H610 L620,781.2 V794.8 H300 Z" fill="#fffdf3" stroke="#9a9a8f" stroke-width="0.9" filter="url(#ds)"/>
  <path d="M610,771.2 V781.2 H620" fill="none" stroke="#9a9a8f" stroke-width="0.9"/>
  <text x="308" y="783.0" font-size="10" fill="#333" dominant-baseline="central">Prepare to flush the buffered output.</text>
  <rect x="135.0" y="816.0" width="150" height="24" rx="12.0" ry="12.0" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="210" y="828.0" font-size="9.5" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">flushOutput</text>
  <line x1="285.0" y1="828.0" x2="300" y2="828.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2.5 2"/>
  <path d="M300,816.2 H610 L620,826.2 V839.8 H300 Z" fill="#fffdf3" stroke="#9a9a8f" stroke-width="0.9" filter="url(#ds)"/>
