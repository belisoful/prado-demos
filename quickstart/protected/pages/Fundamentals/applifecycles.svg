  <text x="63.0" y="885.0" font-size="8.6" fill="#b23b3b">No</text>
  <rect x="14.0" y="896.0" width="88" height="24" rx="12.0" ry="12.0" fill="#f7d1d1" stroke="#b23b3b" stroke-width="1.3" filter="url(#ds)"/>
