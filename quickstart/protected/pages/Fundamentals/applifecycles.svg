  <line x1="210" y1="345.0" x2="210" y2="366.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="210" y1="390.0" x2="210" y2="411.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="210" y1="435.0" x2="210" y2="456.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
