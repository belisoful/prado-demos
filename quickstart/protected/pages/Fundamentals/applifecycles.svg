    <text x="492" y="41" fill="#b23b3b" dominant-baseline="central">exception path</text>
    <rect x="313" y="53" width="17" height="10" rx="5" fill="#fff" stroke="#2f2f2f" stroke-width="0.9"/>
    <text x="337" y="58" dominant-baseline="central">event</text>
    <rect x="468" y="53" width="17" height="10" rx="5" fill="#f7d1d1" stroke="#b23b3b" stroke-width="0.9"/>
    <text x="492" y="58" dominant-baseline="central">onError</text>
  </g>
