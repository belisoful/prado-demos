  <line x1="210" y1="615.0" x2="210" y2="636.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="210" y1="660.0" x2="210" y2="681.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="210" y1="705.0" x2="210" y2="726.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="210" y1="750.0" x2="210" y2="771.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="210" y1="795.0" x2="210" y2="816.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
