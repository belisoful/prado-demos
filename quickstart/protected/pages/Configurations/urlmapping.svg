  <text x="412.0" y="86.0" font-size="8.2" fill="#777" text-anchor="start" dominant-baseline="central">→ Posts.ListPost</text>
  <text x="316.0" y="105.0" font-size="8.4" font-weight="700" fill="#888" text-anchor="start" dominant-baseline="central">3</text>
  <text x="330.0" y="105.0" font-size="8.6" font-family="'DejaVu Sans Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#333" text-anchor="start" dominant-baseline="central">category/{cat}</text>
  <text x="412.0" y="105.0" font-size="8.2" fill="#777" text-anchor="start" dominant-baseline="central">→ Posts.ListPost</text>
  <rect x="626.0" y="58.0" width="168.0" height="44.0" rx="6" fill="#eef1f5" stroke="#7a8a9a" stroke-width="1.1" filter="url(#ds)"/>
