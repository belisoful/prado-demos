  <text x="565.0" y="72.0" font-size="7.6" font-style="italic" fill="#555" text-anchor="middle" dominant-baseline="central">first match → decompose</text>
  <text x="16.0" y="165.0" font-size="10" font-weight="700" fill="#5a8f45" text-anchor="start" dominant-baseline="central">Construct a URL  —  constructUrl() → friendly URL</text>
  <rect x="16.0" y="203.0" width="168.0" height="44.0" rx="6" fill="#eef1f5" stroke="#7a8a9a" stroke-width="1.1" filter="url(#ds)"/>
