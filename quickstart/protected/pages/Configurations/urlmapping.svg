<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 296" width="810" height="296" font-family="Verdana, 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="ds" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0.6" dy="0.9" stdDeviation="0.7" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="810" height="296" fill="#fff"/>
  <text x="16.0" y="20.0" font-size="10" font-weight="700" fill="#4a78a8" text-anchor="start" dominant-baseline="central">Recognize a request  —  incoming URL → parameters</text>
  <rect x="16.0" y="58.0" width="168.0" height="44.0" rx="6" fill="#eef1f5" stroke="#7a8a9a" stroke-width="1.1" filter="url(#ds)"/>
  <text x="100.0" y="74.0" font-size="8.8" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">request path</text>
  <text x="100.0" y="86.0" font-size="8.8" font-family="'DejaVu Sans Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">post/123</text>
  <rect x="290.0" y="37.0" width="214.0" height="86.0" rx="7" fill="#fbfbf9" stroke="#c4c4c4" stroke-width="1.1" filter="url(#ds)"/>
  <text x="397.0" y="49.0" font-size="8.4" font-weight="700" fill="#555" text-anchor="middle" dominant-baseline="central">URL patterns · evaluated in order</text>
  <rect x="296.0" y="58.5" width="202.0" height="17.0" rx="4" fill="#dbe9f6" stroke="#4a78a8" stroke-width="1.2"/>
  <text x="303.0" y="67.0" font-size="9.6" font-weight="700" fill="#4a78a8" text-anchor="start" dominant-baseline="central">✓</text>
  <text x="316.0" y="67.0" font-size="8.4" font-weight="700" fill="#4a78a8" text-anchor="start" dominant-baseline="central">1</text>
