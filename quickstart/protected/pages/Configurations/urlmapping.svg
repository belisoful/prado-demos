  <text x="710.0" y="86.0" font-size="8.8" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">id = 123</text>
  <line x1="184.0" y1="80.0" x2="290.0" y2="80.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrow)"/>
