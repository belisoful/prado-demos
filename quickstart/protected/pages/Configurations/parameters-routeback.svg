<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 507 200" width="507" height="200" font-family="Verdana, 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0.6" dy="0.9" stdDeviation="0.7" flood-color="#000" flood-opacity="0.20"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f2f2f"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b23b3b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="507" height="200" fill="#fff"/>
  <line x1="201.0" y1="82" x2="371.0" y2="82" stroke="#2f2f2f" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="287.0" y="74.0" font-size="9" fill="#2f2f2f" text-anchor="middle">a change is captured and written</text>
  <text x="287.0" y="62.0" font-size="8.6" fill="#555" text-anchor="middle">(at TPageService::onPreRunPage)</text>
  <line x1="373.0" y1="102" x2="203.0" y2="102" stroke="#b23b3b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowr)"/>
  <g stroke="#b23b3b" stroke-width="2">
    <line x1="280.0" y1="95.0" x2="294.0" y2="109.0"/>
    <line x1="280.0" y1="109.0" x2="294.0" y2="95.0"/>
  </g>
  <text x="287.0" y="122.0" font-size="9" fill="#b23b3b" text-anchor="middle">not written back &#8212; no loop</text>
  <rect x="39.0" y="75.0" width="162.0" height="34" rx="8" ry="8" fill="#d4e3f4" stroke="#3f6fa0" stroke-width="1.2" filter="url(#ds)"/>
  <text x="120.0" y="92.0" font-size="10" fill="#1a1a1a" font-weight="600" text-anchor="middle" dominant-baseline="central">application Parameters</text>
  <rect x="373.0" y="75.0" width="114.0" height="34" rx="8" ry="8" fill="#eef4fb" stroke="#3f6fa0" stroke-width="1.2" filter="url(#ds)"/>
  <text x="430.0" y="92.0" font-size="10" fill="#1a1a1a" font-weight="600" text-anchor="middle" dominant-baseline="central">database table</text>
  <text x="253.5" y="172" font-size="8.8" fill="#555" text-anchor="middle">On start the module loads the parameters from the database into the application,</text>
  <text x="253.5" y="184" font-size="8.8" fill="#555" text-anchor="middle">before the capture is attached.</text>
</svg>