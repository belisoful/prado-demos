<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 541" width="904" height="541" font-family="Verdana, 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="ds" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0.6" dy="0.9" stdDeviation="0.7" flood-color="#000" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="904" height="541" fill="#fff"/>
  <text x="160.0" y="30.0" font-size="12" font-weight="700" fill="#333" text-anchor="middle" dominant-baseline="central">Which culture applies</text>
  <line x1="91.0" y1="39.0" x2="229.0" y2="39.0" stroke="#333" stroke-width="1.1"/>
  <rect x="24.0" y="56.0" width="272.0" height="42.5" rx="7" fill="#dbe9f6" stroke="#3f6f9f" stroke-width="1.2" filter="url(#ds)"/>
  <text x="160.0" y="71.5" font-size="9.6" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">DefaultCulture and DefaultCharset</text>
  <text x="160.0" y="83.0" font-size="7.9" font-style="italic" fill="#555" text-anchor="middle" dominant-baseline="central">module properties; the defaults are en and UTF-8</text>
  <polyline points="160.0,98.5 160.0,125.5" fill="none" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="166.0" y="110.0" font-size="7.6" font-style="italic" fill="#555" text-anchor="start" dominant-baseline="central">then, with TGlobalizationAutoDetect</text>
  <rect x="24.0" y="125.5" width="272.0" height="65.5" rx="7" fill="#dbe9f6" stroke="#3f6f9f" stroke-width="1.2" filter="url(#ds)"/>
  <text x="160.0" y="141.0" font-size="9.6" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">Browser Accept-Language</text>
  <text x="160.0" y="152.5" font-size="7.9" font-style="italic" fill="#555" text-anchor="middle" dominant-baseline="central">the first valid locale wins, en-US becomes en_US</text>
  <text x="160.0" y="164.0" font-size="7.9" font-style="italic" fill="#555" text-anchor="middle" dominant-baseline="central">a language outside AvailableLanguages is skipped</text>
  <text x="160.0" y="175.5" font-size="7.9" font-style="italic" fill="#555" text-anchor="middle" dominant-baseline="central">no accepted language leaves the default in place</text>
  <polyline points="160.0,191.0 160.0,218.0" fill="none" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="166.0" y="202.5" font-size="7.6" font-style="italic" fill="#555" text-anchor="start" dominant-baseline="central">then, when a page or code sets it</text>
  <rect x="24.0" y="218.0" width="272.0" height="54.0" rx="7" fill="#dbe9f6" stroke="#3f6f9f" stroke-width="1.2" filter="url(#ds)"/>
  <text x="160.0" y="233.5" font-size="9.6" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">Page directive or code</text>
  <text x="160.0" y="245.0" font-size="7.9" font-family="'DejaVu Sans Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#555" text-anchor="middle" dominant-baseline="central">&lt;%@ Application.Globalization.Culture=&quot;zh&quot; %&gt;</text>
  <text x="160.0" y="256.5" font-size="7.9" font-family="'DejaVu Sans Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#555" text-anchor="middle" dominant-baseline="central">$this-&gt;Application-&gt;Globalization-&gt;Culture = &#x27;zh&#x27;</text>
  <polyline points="160.0,272.0 160.0,299.0" fill="none" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="85.0" y="299.0" width="150.0" height="31.0" rx="15" fill="#dcecd6" stroke="#4f8140" stroke-width="1.2" filter="url(#ds)"/>
  <text x="160.0" y="314.5" font-size="9.6" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">Culture</text>
  <text x="160.0" y="346.0" font-size="7.6" font-style="italic" fill="#555" text-anchor="middle" dominant-baseline="central">each later step replaces the value from the step before it</text>
  <rect x="24.0" y="399.0" width="272.0" height="54.0" rx="7" fill="#eef1f5" stroke="#7a8a9a" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="160.0" y="414.5" font-size="8.6" font-weight="700" fill="#7a8a9a" text-anchor="middle" dominant-baseline="central">No lookup at all</text>
  <text x="160.0" y="426.0" font-size="7.6" font-style="italic" fill="#555" text-anchor="middle" dominant-baseline="central">TranslateDefaultCulture is false and</text>
  <text x="160.0" y="437.5" font-size="7.6" font-style="italic" fill="#555" text-anchor="middle" dominant-baseline="central">Culture equals DefaultCulture: text is returned as written</text>
  <text x="649.0" y="30.0" font-size="12" font-weight="700" fill="#333" text-anchor="middle" dominant-baseline="central">How a string is translated</text>
  <line x1="566.1" y1="39.0" x2="731.9" y2="39.0" stroke="#333" stroke-width="1.1"/>
  <rect x="410.0" y="51.0" width="300.0" height="31.0" rx="15" fill="#eef1f5" stroke="#7a8a9a" stroke-width="1.2" filter="url(#ds)"/>
  <text x="560.0" y="66.5" font-size="8.8" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">Prado::localize()   ·   &lt;com:TTranslate&gt;   ·   &lt;%[ text ]%&gt;</text>
  <polyline points="560.0,82.0 560.0,108.0" fill="none" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <polygon points="560.0,108.0 655.0,131.0 560.0,154.0 465.0,131.0" fill="#fff6d8" stroke="#b08a1f" stroke-width="1.2" filter="url(#ds)"/>
  <text x="560.0" y="125.0" font-size="8.6" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">a translation source</text>
  <text x="560.0" y="137.0" font-size="8.6" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">is configured?</text>
  <text x="566.0" y="161.0" font-size="7.6" font-style="italic" fill="#555" text-anchor="start" dominant-baseline="central">yes</text>
  <polyline points="655.0,131.0 710.0,131.0" fill="none" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="661.0" y="124.0" font-size="7.6" font-style="italic" fill="#555" text-anchor="start" dominant-baseline="central">no</text>
  <rect x="712.0" y="109.8" width="176.0" height="42.5" rx="7" fill="#eef1f5" stroke="#7a8a9a" stroke-width="1.2" filter="url(#ds)"/>
  <text x="800.0" y="125.2" font-size="9.2" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">Text as written</text>
  <text x="800.0" y="136.8" font-size="7.9" font-style="italic" fill="#555" text-anchor="middle" dominant-baseline="central">{params} substituted, no marker</text>
  <polyline points="560.0,154.0 560.0,180.0" fill="none" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="410.0" y="180.0" width="300.0" height="54.0" rx="7" fill="#f6f6f3" stroke="#8a8a8a" stroke-width="1.2" filter="url(#ds)"/>
  <text x="560.0" y="195.5" font-size="9.6" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">MessageSource for the configured type</text>
  <text x="560.0" y="207.0" font-size="7.9" font-style="italic" fill="#555" text-anchor="middle" dominant-baseline="central">XLIFF  ·  gettext  ·  PHP  ·  Database</text>
  <text x="560.0" y="218.5" font-size="7.9" font-style="italic" fill="#555" text-anchor="middle" dominant-baseline="central">source is a directory, or a connection id for Database</text>
  <polyline points="560.0,234.0 560.0,260.0" fill="none" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="410.0" y="260.0" width="300.0" height="123.0" rx="7" fill="#f6f6f3" stroke="#8a8a8a" stroke-width="1.2" filter="url(#ds)"/>
  <text x="560.0" y="275.5" font-size="9.2" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">Load the catalogue, most specific variant first</text>
  <text x="560.0" y="287.0" font-size="7.6" font-style="italic" fill="#666" text-anchor="middle" dominant-baseline="central">for Culture en_US and catalogue messages</text>
  <text x="488.0" y="298.5" font-size="7.8" font-weight="700" fill="#444" text-anchor="middle" dominant-baseline="central">XLIFF, gettext, PHP</text>
  <text x="642.0" y="298.5" font-size="7.8" font-weight="700" fill="#444" text-anchor="middle" dominant-baseline="central">Database</text>
  <text x="488.0" y="310.0" font-size="7.6" font-family="'DejaVu Sans Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2a2a2a" text-anchor="middle" dominant-baseline="central">en_US/messages.xml</text>
  <text x="488.0" y="321.5" font-size="7.6" font-family="'DejaVu Sans Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2a2a2a" text-anchor="middle" dominant-baseline="central">en/messages.xml</text>
  <text x="488.0" y="333.0" font-size="7.6" font-family="'DejaVu Sans Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2a2a2a" text-anchor="middle" dominant-baseline="central">messages.en_US.xml</text>
  <text x="488.0" y="344.5" font-size="7.6" font-family="'DejaVu Sans Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2a2a2a" text-anchor="middle" dominant-baseline="central">messages.en.xml</text>
  <text x="488.0" y="356.0" font-size="7.6" font-family="'DejaVu Sans Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2a2a2a" text-anchor="middle" dominant-baseline="central">messages.xml</text>
  <text x="642.0" y="310.0" font-size="7.6" font-family="'DejaVu Sans Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2a2a2a" text-anchor="middle" dominant-baseline="central">messages.en_US</text>
  <text x="642.0" y="321.5" font-size="7.6" font-family="'DejaVu Sans Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2a2a2a" text-anchor="middle" dominant-baseline="central">messages.en</text>
  <text x="642.0" y="333.0" font-size="7.6" font-family="'DejaVu Sans Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2a2a2a" text-anchor="middle" dominant-baseline="central">messages</text>
  <line x1="566.0" y1="292.5" x2="566.0" y2="361.5" stroke="#d0d0cc" stroke-width="1"/>
  <text x="560.0" y="367.5" font-size="7.6" font-style="italic" fill="#666" text-anchor="middle" dominant-baseline="central">cache=true keeps each loaded variant in runtime/i18n</text>
  <polyline points="560.0,383.0 560.0,409.0" fill="none" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <polygon points="560.0,409.0 680.0,433.0 560.0,457.0 440.0,433.0" fill="#fff6d8" stroke="#b08a1f" stroke-width="1.2" filter="url(#ds)"/>
  <text x="560.0" y="427.0" font-size="8.6" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">the first variant holding the</text>
  <text x="560.0" y="439.0" font-size="8.6" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">string has a target?</text>
  <text x="566.0" y="464.0" font-size="7.6" font-style="italic" fill="#555" text-anchor="start" dominant-baseline="central">yes</text>
  <polyline points="680.0,433.0 710.0,433.0" fill="none" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="686.0" y="426.0" font-size="7.6" font-style="italic" fill="#555" text-anchor="start" dominant-baseline="central">no</text>
  <rect x="712.0" y="406.0" width="176.0" height="54.0" rx="7" fill="#f6e6c8" stroke="#b07f24" stroke-width="1.2" filter="url(#ds)"/>
  <text x="800.0" y="421.5" font-size="9.2" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">@@text@@</text>
  <text x="800.0" y="433.0" font-size="7.9" font-style="italic" fill="#555" text-anchor="middle" dominant-baseline="central">the marker wraps the text</text>
  <text x="800.0" y="444.5" font-size="7.9" font-style="italic" fill="#555" text-anchor="middle" dominant-baseline="central">autosave appends it on OnEndRequest</text>
  <polyline points="560.0,457.0 560.0,483.0" fill="none" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="410.0" y="483.0" width="300.0" height="42.5" rx="7" fill="#dcecd6" stroke="#4f8140" stroke-width="1.2" filter="url(#ds)"/>
  <text x="560.0" y="498.5" font-size="9.4" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">Translated target</text>
  <text x="560.0" y="510.0" font-size="7.9" font-style="italic" fill="#555" text-anchor="middle" dominant-baseline="central">{params} substituted</text>
</svg>