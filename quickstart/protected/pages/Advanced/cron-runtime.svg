<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 299" width="512" height="299" font-family="Verdana, 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="ds" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0.6" dy="0.9" stdDeviation="0.7" flood-color="#000" flood-opacity="0.20"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f2f2f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="512" height="299" fill="#fff"/>
  <line x1="176" y1="57.0" x2="176" y2="99.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="176" y1="125.0" x2="176" y2="164.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="176" y1="208.0" x2="176" y2="255.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="109.9" y="31.0" width="132.2" height="26" rx="7" ry="7" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="176.0" y="44.0" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle" dominant-baseline="central">add a runtime task</text>
  <text x="251.1" y="44.0" font-size="8.6" fill="#555" dominant-baseline="central">a web request: addTask($task, true)</text>
  <rect x="89.2" y="99.0" width="173.5" height="26" rx="7" ry="7" fill="#eef4fb" stroke="#3f6fa0" stroke-width="1.15" filter="url(#ds)"/>
  <text x="176.0" y="112.0" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle" dominant-baseline="central">persist in the cron table</text>
  <polygon points="176,164 249.1,186 176,208 102.9,186" fill="#fff3e0" stroke="#c79a3a" stroke-width="1.15" filter="url(#ds)"/>
  <text x="176.0" y="186.0" font-size="9.5" fill="#7a1f1f" text-anchor="middle" dominant-baseline="central">request completes?</text>
  <rect x="106.9" y="255.0" width="138.1" height="26" rx="7" ry="7" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="176.0" y="268.0" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle" dominant-baseline="central">run at onEndRequest</text>
  <text x="254.1" y="268.0" font-size="8.6" fill="#555" dominant-baseline="central">sends the email now</text>
  <text x="182.0" y="231.5" font-size="8.8" fill="#2f2f2f">Yes</text>
  <line x1="249.1" y1="186" x2="272.0" y2="186" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="260.6" y="181.0" font-size="8.8" fill="#2f2f2f" text-anchor="middle">No</text>
  <rect x="272.0" y="173.0" width="144.0" height="26" rx="7" ry="7" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="344.0" y="186.0" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle" dominant-baseline="central">run at the next cron</text>
  <text x="425.0" y="186.0" font-size="8.6" fill="#555" dominant-baseline="central">the backup</text>
</svg>