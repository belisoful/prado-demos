  <polyline points="262.0,410.0 298.5,410.0" fill="none" stroke="#4a4a4a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="207.0" y="262.0" font-size="8.6" fill="#555" text-anchor="start" dominant-baseline="central" font-style="italic">yes</text>
  <text x="207.0" y="357.0" font-size="8.6" fill="#555" text-anchor="start" dominant-baseline="central" font-style="italic">yes</text>
  <text x="207.0" y="447.0" font-size="8.6" fill="#555" text-anchor="start" dominant-baseline="central" font-style="italic">allow</text>
  <text x="120.0" y="218.0" font-size="8.6" fill="#555" text-anchor="middle" dominant-baseline="central" font-style="italic">no</text>
  <text x="269.0" y="310.0" font-size="8.6" fill="#555" text-anchor="start" dominant-baseline="central" font-style="italic">no · next rule</text>
  <text x="280.2" y="401.0" font-size="8.6" fill="#555" text-anchor="middle" dominant-baseline="central" font-style="italic">deny</text>
  <rect x="126.0" y="12.0" width="140.0" height="28.0" rx="14.0" fill="#eef1f5" stroke="#7a8a9a" stroke-width="1.2" filter="url(#ds)"/>
  <text x="196.0" y="26.0" font-size="9.6" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">Page request</text>
  <rect x="35.0" y="61.0" width="322.0" height="42.0" rx="7" fill="#dbe9f6" stroke="#4a78a8" stroke-width="1.2" filter="url(#ds)"/>
  <text x="196.0" y="75.7" font-size="9.6" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">Authentication — TAuthManager restores the</text>
  <text x="196.0" y="88.3" font-size="9.6" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">user from the session (otherwise a guest)</text>
  <rect x="35.0" y="129.0" width="322.0" height="46.0" rx="7" fill="#dbe9f6" stroke="#4a78a8" stroke-width="1.2" filter="url(#ds)"/>
  <text x="196.0" y="145.7" font-size="9.6" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">Authorization — gather the page&#x27;s rules,</text>
  <text x="196.0" y="158.3" font-size="9.6" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">bottom-up: current folder, then parent folders</text>
  <path d="M196.0,199.0 L256.0,226.0 L196.0,253.0 L136.0,226.0 Z" fill="#f6e6c8" stroke="#b8862a" stroke-width="1.2" filter="url(#ds)"/>
  <text x="196.0" y="219.7" font-size="9.6" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">more</text>
  <text x="196.0" y="232.3" font-size="9.6" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">rules?</text>
