  <text x="196.0" y="311.7" font-size="9.6" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">rule</text>
  <text x="196.0" y="324.3" font-size="9.6" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">applies?</text>
  <path d="M196.0,382.0 L262.0,410.0 L196.0,438.0 L130.0,410.0 Z" fill="#f6e6c8" stroke="#b8862a" stroke-width="1.2" filter="url(#ds)"/>
  <text x="196.0" y="403.7" font-size="9.6" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">rule</text>
  <text x="196.0" y="416.3" font-size="9.6" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">action?</text>
  <rect x="66.0" y="476.0" width="248.0" height="40.0" rx="20.0" fill="#dcecd6" stroke="#5a8f45" stroke-width="1.2" filter="url(#ds)"/>
  <text x="190.0" y="496.0" font-size="9.6" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">AUTHORIZED — run the page</text>
  <rect x="298.5" y="391.0" width="211.0" height="38.0" rx="19.0" fill="#f3d3d3" stroke="#c05a3a" stroke-width="1.2" filter="url(#ds)"/>
  <text x="404.0" y="410.0" font-size="9.6" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">DENIED — redirect to LoginPage</text>
  <text x="270.0" y="544.0" font-size="8.8" fill="#666" text-anchor="middle" font-style="italic">A rule applies when  verb ∧ ip ∧ user ∧ role  all match (each unset dimension matches all), for a page the rule lists.</text>
  <text x="270.0" y="558.0" font-size="8.8" fill="#666" text-anchor="middle" font-style="italic">The first applicable rule decides; if none applies, the user is authorized.</text>
</svg>