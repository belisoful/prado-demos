<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 481 395" width="481" height="395" font-family="Verdana, 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="ds" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0.6" dy="0.9" stdDeviation="0.7" flood-color="#000" flood-opacity="0.20"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f2f2f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="481" height="395" fill="#fff"/>
  <line x1="150" y1="57.0" x2="150" y2="91.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="150" y1="117.0" x2="150" y2="149.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="150" y1="175.0" x2="150" y2="208.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="150" y1="252.0" x2="150" y2="293.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="150" y1="319.0" x2="150" y2="351.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="104.5" y="31.0" width="90.9" height="26" rx="7" ry="7" fill="#eef0f2" stroke="#7a8290" stroke-width="1.15" stroke-dasharray="4 3" filter="url(#ds)"/>
  <text x="150.0" y="44.0" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle" dominant-baseline="central">system cron</text>
  <text x="204.4" y="44.0" font-size="8.6" fill="#555" dominant-baseline="central">your OS, every minute</text>
  <rect x="95.7" y="91.0" width="108.6" height="26" rx="7" ry="7" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="150.0" y="104.0" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle" dominant-baseline="central">prado-cli cron</text>
  <rect x="104.5" y="149.0" width="90.9" height="26" rx="7" ry="7" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="150.0" y="162.0" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle" dominant-baseline="central">TCronModule</text>
  <text x="204.4" y="162.0" font-size="8.6" fill="#555" dominant-baseline="central">for each job</text>
  <polygon points="150,208 208.3,230 150,252 91.7,230" fill="#fff3e0" stroke="#c79a3a" stroke-width="1.15" filter="url(#ds)"/>
  <text x="150.0" y="230.0" font-size="9.5" fill="#7a1f1f" text-anchor="middle" dominant-baseline="central">schedule due?</text>
  <rect x="101.6" y="293.0" width="96.8" height="26" rx="7" ry="7" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="150.0" y="306.0" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle" dominant-baseline="central">run the task</text>
  <text x="207.4" y="306.0" font-size="8.6" fill="#555" dominant-baseline="central">as its user</text>
  <rect x="104.5" y="351.0" width="90.9" height="26" rx="7" ry="7" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="150.0" y="364.0" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle" dominant-baseline="central">log the run</text>
  <text x="156.0" y="272.5" font-size="8.8" fill="#2f2f2f">Yes</text>
  <line x1="208.3" y1="230" x2="269.0" y2="230" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="238.7" y="225.0" font-size="8.8" fill="#2f2f2f" text-anchor="middle">No</text>
  <rect x="269.0" y="217.0" width="62.0" height="26" rx="7" ry="7" fill="#ffffff" stroke="#2f2f2f" stroke-width="1.15" filter="url(#ds)"/>
  <text x="300.0" y="230.0" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle" dominant-baseline="central">skip</text>
</svg>