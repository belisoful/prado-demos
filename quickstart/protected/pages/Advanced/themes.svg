<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 664 308" width="664" height="308" font-family="Verdana, 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="ds" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0.6" dy="0.9" stdDeviation="0.7" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="664" height="308" fill="#fff"/>
  <text x="152.0" y="30.0" font-size="12" font-weight="700" fill="#333" text-anchor="middle" dominant-baseline="central">A theme directory</text>
  <line x1="94.0" y1="39.0" x2="210.0" y2="39.0" stroke="#333" stroke-width="1.1"/>
  <line x1="26.0" y1="78.0" x2="26.0" y2="94.5" stroke="#9aa0a6" stroke-width="1"/>
  <line x1="26.0" y1="94.5" x2="36.0" y2="94.5" stroke="#9aa0a6" stroke-width="1"/>
  <line x1="46.0" y1="106.0" x2="46.0" y2="122.5" stroke="#9aa0a6" stroke-width="1"/>
  <line x1="46.0" y1="122.5" x2="56.0" y2="122.5" stroke="#9aa0a6" stroke-width="1"/>
  <line x1="46.0" y1="106.0" x2="46.0" y2="150.5" stroke="#9aa0a6" stroke-width="1"/>
  <line x1="46.0" y1="150.5" x2="56.0" y2="150.5" stroke="#9aa0a6" stroke-width="1"/>
  <line x1="46.0" y1="106.0" x2="46.0" y2="178.5" stroke="#9aa0a6" stroke-width="1"/>
  <line x1="46.0" y1="178.5" x2="56.0" y2="178.5" stroke="#9aa0a6" stroke-width="1"/>
  <line x1="46.0" y1="106.0" x2="46.0" y2="206.5" stroke="#9aa0a6" stroke-width="1"/>
  <line x1="46.0" y1="206.5" x2="56.0" y2="206.5" stroke="#9aa0a6" stroke-width="1"/>
  <line x1="46.0" y1="106.0" x2="46.0" y2="234.5" stroke="#9aa0a6" stroke-width="1"/>
  <line x1="46.0" y1="234.5" x2="56.0" y2="234.5" stroke="#9aa0a6" stroke-width="1"/>
  <rect x="16.0" y="55.0" width="56.6" height="23.0" rx="6" fill="#f6ecd0" stroke="#b89a4a" stroke-width="1.1" filter="url(#ds)"/>
  <text x="24.0" y="66.5" font-size="9.2" font-weight="700" fill="#1a1a1a" text-anchor="start" dominant-baseline="central">themes/</text>
  <rect x="36.0" y="83.0" width="67.7" height="23.0" rx="6" fill="#f6ecd0" stroke="#b89a4a" stroke-width="1.1" filter="url(#ds)"/>
  <text x="44.0" y="94.5" font-size="9.2" font-weight="700" fill="#1a1a1a" text-anchor="start" dominant-baseline="central">MyTheme/</text>
  <text x="113.7" y="94.5" font-size="7.8" font-style="italic" fill="#777" text-anchor="start" dominant-baseline="central">the Theme (= directory name)</text>
  <rect x="56.0" y="111.0" width="87.8" height="23.0" rx="6" fill="#f6e6c8" stroke="#b8862a" stroke-width="1.1" filter="url(#ds)"/>
  <text x="64.0" y="122.5" font-size="9.2" font-family="'DejaVu Sans Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#1a1a1a" text-anchor="start" dominant-baseline="central">Button.skin</text>
  <text x="153.8" y="122.5" font-size="7.8" font-style="italic" fill="#777" text-anchor="start" dominant-baseline="central">control skins</text>
  <rect x="56.0" y="139.0" width="87.8" height="23.0" rx="6" fill="#f6e6c8" stroke="#b8862a" stroke-width="1.1" filter="url(#ds)"/>
  <text x="64.0" y="150.5" font-size="9.2" font-family="'DejaVu Sans Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#1a1a1a" text-anchor="start" dominant-baseline="central">Label.skin</text>
  <text x="153.8" y="150.5" font-size="7.8" font-style="italic" fill="#777" text-anchor="start" dominant-baseline="central">control skins</text>
  <rect x="56.0" y="167.0" width="87.8" height="23.0" rx="6" fill="#dbe9f6" stroke="#4a78a8" stroke-width="1.1" filter="url(#ds)"/>
  <text x="64.0" y="178.5" font-size="9.2" font-family="'DejaVu Sans Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#1a1a1a" text-anchor="start" dominant-baseline="central">app.css</text>
  <text x="153.8" y="178.5" font-size="7.8" font-style="italic" fill="#777" text-anchor="start" dominant-baseline="central">CSS · all media</text>
  <rect x="56.0" y="195.0" width="87.8" height="23.0" rx="6" fill="#dbe9f6" stroke="#4a78a8" stroke-width="1.1" filter="url(#ds)"/>
  <text x="64.0" y="206.5" font-size="9.2" font-family="'DejaVu Sans Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#1a1a1a" text-anchor="start" dominant-baseline="central">app.print.css</text>
  <text x="153.8" y="206.5" font-size="7.8" font-style="italic" fill="#777" text-anchor="start" dominant-baseline="central">CSS · print only</text>
  <rect x="56.0" y="223.0" width="87.8" height="23.0" rx="6" fill="#dcecd6" stroke="#5a8f45" stroke-width="1.1" filter="url(#ds)"/>
  <text x="64.0" y="234.5" font-size="9.2" font-family="'DejaVu Sans Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#1a1a1a" text-anchor="start" dominant-baseline="central">app.js</text>
  <text x="153.8" y="234.5" font-size="7.8" font-style="italic" fill="#777" text-anchor="start" dominant-baseline="central">JavaScript</text>
  <text x="496.0" y="30.0" font-size="12" font-weight="700" fill="#333" text-anchor="middle" dominant-baseline="central">Property-value precedence</text>
  <line x1="409.3" y1="39.0" x2="582.7" y2="39.0" stroke="#333" stroke-width="1.1"/>
  <rect x="346.0" y="55.0" width="300.0" height="46.0" rx="7" fill="#dcecd6" stroke="#5a8f45" stroke-width="1.3" filter="url(#ds)"/>
  <text x="496.0" y="72.0" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">Theme skin</text>
  <text x="496.0" y="86.0" font-size="8.0" font-style="italic" fill="#555" text-anchor="middle" dominant-baseline="central">overwrites · applied after the template</text>
  <text x="638.0" y="64.0" font-size="8.2" font-weight="700" fill="#5a8f45" text-anchor="end" dominant-baseline="central">highest priority</text>
  <rect x="346.0" y="131.0" width="300.0" height="38.0" rx="7" fill="#dbe9f6" stroke="#4a78a8" stroke-width="1.3" filter="url(#ds)"/>
  <text x="496.0" y="144.0" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">Template markup</text>
  <text x="496.0" y="158.0" font-size="8.0" font-style="italic" fill="#555" text-anchor="middle" dominant-baseline="central">the control tag&#x27;s own values</text>
  <text x="638.0" y="140.0" font-size="8.2" font-weight="700" fill="#4a78a8" text-anchor="end" dominant-baseline="central">medium priority</text>
  <rect x="346.0" y="199.0" width="300.0" height="46.0" rx="7" fill="#f6e6c8" stroke="#b8862a" stroke-width="1.3" filter="url(#ds)"/>
  <text x="496.0" y="216.0" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">StyleSheetTheme skin</text>
  <text x="496.0" y="230.0" font-size="8.0" font-style="italic" fill="#555" text-anchor="middle" dominant-baseline="central">initial value · applied before the template</text>
  <text x="638.0" y="208.0" font-size="8.2" font-weight="700" fill="#b8862a" text-anchor="end" dominant-baseline="central">lowest priority</text>
  <line x1="496.0" y1="131.0" x2="496.0" y2="101.0" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="509.0" y="116.0" font-size="7.8" font-style="italic" fill="#666" text-anchor="start" dominant-baseline="central">overrides</text>
  <line x1="496.0" y1="199.0" x2="496.0" y2="169.0" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="509.0" y="184.0" font-size="7.8" font-style="italic" fill="#666" text-anchor="start" dominant-baseline="central">overrides</text>
  <text x="496.0" y="262.0" font-size="8.4" font-style="italic" fill="#666" text-anchor="middle" dominant-baseline="central">For a property, the highest layer that sets it wins.</text>
  <text x="496.0" y="275.0" font-size="8.4" font-style="italic" fill="#666" text-anchor="middle" dominant-baseline="central">A skin matches when the control type and SkinID both match</text>
  <text x="496.0" y="287.0" font-size="8.4" font-style="italic" fill="#666" text-anchor="middle" dominant-baseline="central">(an empty SkinID matches controls with no SkinID).</text>
  <text x="20.0" y="256.0" font-size="7.8" font-style="italic" fill="#777" text-anchor="start" dominant-baseline="central">The file names are the developer&#x27;s own choice, not fixed names.</text>
  <text x="20.0" y="268.0" font-size="7.8" font-style="italic" fill="#777" text-anchor="start" dominant-baseline="central">A control gets a skin from a matching tag inside a skin file</text>
  <text x="20.0" y="280.0" font-size="7.8" font-style="italic" fill="#777" text-anchor="start" dominant-baseline="central">(e.g. &lt;com:TButton SkinID=&quot;Blue&quot;/&gt;), not from the file name.</text>
  <text x="20.0" y="292.0" font-size="7.8" font-style="italic" fill="#777" text-anchor="start" dominant-baseline="central">For CSS, only the .&lt;media&gt; infix (as in app.print.css) is meaningful.</text>
</svg>