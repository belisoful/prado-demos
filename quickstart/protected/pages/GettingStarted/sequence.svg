<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 549 380" width="549" height="380" font-family="Verdana, 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="ds" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0.7" dy="1.0" stdDeviation="0.8" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f2f2f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="549" height="380" fill="#fff"/>
  <line x1="168" y1="44" x2="168" y2="368" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="392" y1="44" x2="392" y2="368" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="162.5" y="88.0" width="11" height="252.0" rx="1.5" fill="#eef5fc" stroke="#2f2f2f" stroke-width="1"/>
  <rect x="386.5" y="126.0" width="11" height="88.0" rx="1.5" fill="#f2ecfa" stroke="#2f2f2f" stroke-width="1"/>
  <rect x="116.0" y="14" width="104" height="30" rx="4" fill="#dbe9f6" stroke="#2f2f2f" stroke-width="1.2" filter="url(#ds)"/>
  <text x="168.0" y="29.0" font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">Page</text>
  <rect x="340.0" y="14" width="104" height="30" rx="4" fill="#e6dcf2" stroke="#2f2f2f" stroke-width="1.2" filter="url(#ds)"/>
  <text x="392.0" y="29.0" font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">Button</text>
  <line x1="18.0" y1="88.0" x2="162.5" y2="88.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="18.0" y="82.0" font-size="9.6" fill="#1a1a1a" text-anchor="start">Button Click</text>
  <text x="22.0" y="99.0" font-size="9.6" fill="#666" text-anchor="start" font-style="italic">(postback)</text>
  <line x1="173.5" y1="126.0" x2="386.5" y2="126.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="280.0" y="120.0" font-size="9.6" fill="#1a1a1a" text-anchor="middle">raisePostBackEvent()</text>
  <path d="M397.5,164.0 h30 v20 h-30" fill="none" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="433.5" y="174.0" font-size="9.6" fill="#1a1a1a" text-anchor="start">raises OnClick event</text>
  <line x1="386.5" y1="214.0" x2="173.5" y2="214.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="280.0" y="208.0" font-size="9.6" fill="#1a1a1a" text-anchor="middle">buttonClicked($sender, $param)</text>
  <line x1="173.5" y1="244.0" x2="189.5" y2="244.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2.5 2"/>
  <path d="M189.5,233.0 H360.5 L368.5,241.0 V255.0 H189.5 Z" fill="#fffdf3" stroke="#9a9a8f" stroke-width="0.9" filter="url(#ds)"/>
  <path d="M360.5,233.0 V241.0 H368.5" fill="none" stroke="#9a9a8f" stroke-width="0.9"/>
  <text x="197.5" y="244.0" font-size="9.6" fill="#1a1a1a" text-anchor="start">$sender-&gt;Text = &quot;Hello World!&quot;;</text>
  <path d="M173.5,300.0 h30 v20 h-30" fill="none" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="209.5" y="310.0" font-size="9.6" fill="#1a1a1a" text-anchor="start">render()</text>
  <line x1="162.5" y1="340.0" x2="18.0" y2="340.0" stroke="#2f2f2f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="18.0" y="334.0" font-size="9.6" fill="#1a1a1a" text-anchor="start">Page Content</text>
  <text x="27.0" y="351.0" font-size="9.6" fill="#666" text-anchor="start" font-style="italic">(updated caption)</text>
